name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .[dev]

      - name: Run tests
        run: python -m pytest

      - name: Build Windows package
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Create zip archive
        shell: pwsh
        run: Compress-Archive -Path dist\MacroTool\* -DestinationPath MacroTool-windows.zip -Force

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: MacroTool-windows.zip
